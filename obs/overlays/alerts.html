<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface:      #231451;
    --surface-deep: #170C38;
    --text-strong:  #F4F1FF;
    --accent-blue:  #4DE1FF;
    --accent-pink:  #FF5FA2;
    --accent-yellow:#FFE156;
    --accent-mint:  #37F0A6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    width: 560px;
    overflow: hidden;
  }

  #alert-box {
    display: none;
    position: relative;
    background: rgba(23, 12, 56, 0.95);
    border: 2px solid var(--accent-blue);
    border-radius: 8px;
    padding: 18px 22px 18px 18px;
    margin: 12px;
    overflow: hidden;
    animation: alertIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  #alert-box.out {
    animation: alertOut 0.4s ease-in forwards;
  }

  #alert-box.follow  { border-color: var(--accent-blue); }
  #alert-box.sub     { border-color: var(--accent-mint); }
  #alert-box.resub   { border-color: var(--accent-mint); }
  #alert-box.cheer   { border-color: var(--accent-yellow); }
  #alert-box.raid    { border-color: var(--accent-pink); }
  #alert-box.giftsub { border-color: var(--accent-pink); }

  /* Glitch scan-line stripe */
  #alert-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(77, 225, 255, 0.03) 0px,
      rgba(77, 225, 255, 0.03) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
  }

  /* Accent left bar */
  #alert-box::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent-blue);
    border-radius: 8px 0 0 8px;
  }
  #alert-box.sub::after,
  #alert-box.resub::after  { background: var(--accent-mint); }
  #alert-box.cheer::after  { background: var(--accent-yellow); }
  #alert-box.raid::after,
  #alert-box.giftsub::after { background: var(--accent-pink); }

  .alert-type {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin-bottom: 5px;
  }
  .sub .alert-type, .resub .alert-type   { color: var(--accent-mint); }
  .cheer .alert-type                     { color: var(--accent-yellow); }
  .raid .alert-type, .giftsub .alert-type { color: var(--accent-pink); }

  .alert-name {
    font-size: 22px;
    font-weight: bold;
    color: var(--text-strong);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .alert-detail {
    font-size: 13px;
    color: rgba(244, 241, 255, 0.7);
  }

  /* Glitch flicker on the name */
  @keyframes glitch {
    0%, 90%, 100% { clip-path: none; transform: none; }
    91% { clip-path: inset(30% 0 40% 0); transform: translateX(-3px); }
    93% { clip-path: inset(60% 0 10% 0); transform: translateX(3px); }
    95% { clip-path: inset(10% 0 70% 0); transform: translateX(-2px); }
  }

  .alert-name {
    animation: glitch 3s infinite;
  }

  @keyframes alertIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes alertOut {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.95); }
  }

  /* Particle burst */
  .particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    animation: burst 0.8s ease-out forwards;
  }
  @keyframes burst {
    from { opacity: 1; transform: translate(0,0) scale(1); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body>
<div id="alert-box">
  <div class="particles" id="particles"></div>
  <div class="alert-type" id="alert-type">NEW FOLLOWER</div>
  <div class="alert-name" id="alert-name">Username</div>
  <div class="alert-detail" id="alert-detail"></div>
</div>

<script>
  const COLORS = ['#4DE1FF','#FF5FA2','#FFE156','#37F0A6'];
  const HIDE_AFTER_MS = 5000;
  let hideTimer = null;

  function spawnParticles(color) {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = color;
      p.style.left = (20 + Math.random() * 60) + '%';
      p.style.top  = (20 + Math.random() * 60) + '%';
      const angle = Math.random() * Math.PI * 2;
      const dist  = 30 + Math.random() * 60;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.animationDelay = (Math.random() * 0.2) + 's';
      container.appendChild(p);
    }
  }

  function showAlert({ type, name, detail, color }) {
    clearTimeout(hideTimer);
    const box = document.getElementById('alert-box');
    box.className = type;
    box.style.display = 'block';
    document.getElementById('alert-type').textContent = {
      follow:   '✦ NEW FOLLOWER',
      sub:      '★ NEW SUBSCRIBER',
      resub:    '★ RESUBSCRIBED',
      giftsub:  '♦ GIFT SUB',
      cheer:    '▲ CHEERED',
      raid:     '! RAID INCOMING',
    }[type] || type.toUpperCase();
    document.getElementById('alert-name').textContent = name;
    document.getElementById('alert-detail').textContent = detail || '';
    spawnParticles(color);

    hideTimer = setTimeout(() => {
      box.classList.add('out');
      setTimeout(() => { box.style.display = 'none'; box.className = ''; }, 400);
    }, HIDE_AFTER_MS);
  }

  // StreamElements event bridge
  window.addEventListener('onEventReceived', (e) => {
    const { listener, event } = e.detail;
    const name = event.name || event.sender || 'Someone';

    if (listener === 'follower-latest')
      showAlert({ type: 'follow', name, detail: 'just followed!', color: '#4DE1FF' });

    else if (listener === 'subscriber-latest')
      showAlert({ type: event.gifted ? 'giftsub' : 'sub', name,
        detail: event.gifted ? `gifted by ${event.sender}` : `${event.amount} month${event.amount>1?'s':''}`,
        color: event.gifted ? '#FF5FA2' : '#37F0A6' });

    else if (listener === 'cheer-latest')
      showAlert({ type: 'cheer', name, detail: `${event.amount} bits`, color: '#FFE156' });

    else if (listener === 'raid-latest')
      showAlert({ type: 'raid', name, detail: `raiding with ${event.amount} viewers`, color: '#FF5FA2' });
  });

  // Dev preview — remove when live
  const demos = [
    { type:'follow',  name:'neon_ghost',   detail:'just followed!',        color:'#4DE1FF' },
    { type:'sub',     name:'binary_bunny', detail:'1 month',               color:'#37F0A6' },
    { type:'cheer',   name:'archive_rat',  detail:'500 bits',              color:'#FFE156' },
    { type:'raid',    name:'pixelDrifter', detail:'raiding with 42 viewers',color:'#FF5FA2'},
    { type:'giftsub', name:'chat_user_1',  detail:'gifted by neon_ghost',  color:'#FF5FA2' },
  ];
  let dIdx = 0;
  function demoAlert() {
    showAlert(demos[dIdx % demos.length]);
    dIdx++;
    setTimeout(demoAlert, 7000);
  }
  // Comment out when live:
  setTimeout(demoAlert, 1500);
</script>
</body>
</html>
