{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <span class="date">{{ .Date.Format "2006-01-02" }}</span>
      {{ with .ReadingTime }}<span class="reading-time">{{ . }} min read</span>{{ end }}
      {{ with .Params.tags }}
      <div class="post-tags">
        {{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/" class="tag">{{ . }}</a>{{ end }}
      </div>
      {{ end }}
    </div>
  </header>

  {{ if .TableOfContents }}
  <nav class="toc">
    <div class="toc-title">// TABLE OF CONTENTS</div>
    {{ .TableOfContents }}
  </nav>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
